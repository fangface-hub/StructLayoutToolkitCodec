[project]
name = "sltcodec"
version = "0.4.0"
description = "Decode and encode bytearrays according to struct layout definitions using sltcore."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sltcalc>=0.1.0",
    "sltcore>=1.5.0",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "fangface" }
]
keywords = ["struct", "byte", "layout", "serialization", "deserialization"]

[project.urls]
Homepage = "https://github.com/fangface-hub/StructLayoutToolkitCodec"
Documentation = "https://readthedocs.org"
Repository = "https://github.com/fangface-hub/StructLayoutToolkitCodec"
Issues = "https://github.com/fangface-hub/StructLayoutToolkitCodec/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sltcodec"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
